/* =========================================================
   CLIENTE SUPABASE
========================================================= */

const supabaseClient = {
  async rpc(funcao, parametros = {}){

    const resposta =
      await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/${funcao}`,
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY,
            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          },
          body:JSON.stringify(parametros)
        }
      );

    const texto =
      await resposta.text();

    let data = null;

    try{
      data = texto ? JSON.parse(texto) : null;
    }catch(e){
      data = texto;
    }

    if(!resposta.ok){

      throw new Error(
        data?.message ||
        data?.error ||
        "Erro na comunicação com o servidor."
      );

    }

    return {
      data,
      error:null
    };
  }
};

async function carregarPetPublico(){

  try{

    loading.style.display = "block";

    const resultado =
      await supabaseClient.rpc(
        "get_pet_public",
        {
          p_codigo:codigo
        }
      );


    if(
      resultado.error ||
      !resultado.data ||
      (
        Array.isArray(resultado.data) &&
        resultado.data.length === 0
      )
    ){

      loading.style.display = "none";
      erro.style.display = "block";

      return;

    }


    let pet =
      Array.isArray(resultado.data)
        ? resultado.data[0]
        : resultado.data;


    preencherPagina(pet);

  }catch(error){

    console.error(error);

    loading.style.display = "none";
    erro.style.display = "block";

  }

}
