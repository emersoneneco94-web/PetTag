:root{--primary:#0b5574;--primary-light:#e6f4f8;--green:#07966b;--green-bg:#dff8ee;--blue:#2563eb;--red:#dc2626;--bg:#f8fcfb;--card:#fff;--text:#1a2e35;--text2:#6d8187;--border:#e2e8f0;--yellow:#f59e0b;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-lg:0 4px 24px rgba(0,0,0,.1)}

/* NFC TAG CSS */
.tag-wrap{position:relative;display:inline-flex;flex-direction:column;align-items:center;padding-top:14px;margin:0 auto 1rem}
.tag-ring{position:absolute;top:0;left:50%;transform:translateX(-50%);width:18px;height:18px;border:3.5px solid #9ca3af;border-radius:50%;z-index:1}
.nfc-tag{width:86px;height:86px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(0,0,0,.15),inset 0 2px 4px rgba(255,255,255,.3),inset 0 -3px 6px rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.2);z-index:2}
.nfc-tag .paw{font-size:26px;line-height:1}
.nfc-tag .nfc{font-size:10px;font-weight:900;color:#fff;letter-spacing:1.5px;margin-top:2px}
.tag-blue{background:radial-gradient(circle at 35% 35%,#3b82f6,#1d4ed8)}
.tag-black{background:radial-gradient(circle at 35% 35%,#374151,#111827)}
.tag-red{background:radial-gradient(circle at 35% 35%,#ef4444,#b91c1c)}
.tag-pink{background:radial-gradient(circle at 35% 35%,#f472b6,#db2777)}

.header{position:sticky;top:0;background:#fff;z-index:1000;transition:box-shadow .3s;border-bottom:1px solid var(--border)}
