<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetTAG - Identificação Inteligente</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f7f5;
      color: #123b5d;
    }

    header {
      background: white;
      padding: 18px 20px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
    }

    .logo span {
      color: #20a85a;
    }

    .subtitle {
      font-size: 12px;
      margin-top: 3px;
      letter-spacing: 1px;
    }

    .hero {
      position: relative;
      height: 330px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-text {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 2px 5px black;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .pet-name {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin-top: -5px;
    }

    .pet-info {
      text-align: center;
      font-size: 17px;
      margin: 8px 0 15px;
    }

    .tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .tag {
      padding: 9px 14px;
      border-radius: 20px;
      background: #dff5e8;
      color: #16864a;
      font-weight: bold;
      font-size: 13px;
    }

    .contact-box {
      background: linear-gradient(135deg, #13a052, #0d8c46);
      color: white;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
    }

    .contact-title {
      font-size: 22px;
      font-weight: bold;
    }

    .contact-subtitle {
      margin: 5px 0 15px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 15px 5px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      text-decoration: none;
      display: block;
    }

    .whatsapp {
      background: #20b95c;
    }

    .call {
      background: #1478e8;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .menu-item {
      background: white;
      border-radius: 15px;
      padding: 14px 5px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      font-size: 13px;
      font-weight: bold;
    }

    .icon {
      font-size: 25px;
      display: block;
      margin-bottom: 5px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #0c4775;
    }

    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }

    .row:last-child {
      border-bottom: none;
    }

    .vaccine {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
