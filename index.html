<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Save Tag Pet</title>

<meta
  name="description"
  content="Identificação inteligente para o seu pet."
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  color:#123437;
  background:#f3fbfa;
}

a{
  text-decoration:none;
}

button{
  font-family:inherit;
}


/* =========================================================
   CORES
========================================================= */

:root{
  --verde:#0c3034;
  --verde2:#116d68;
  --turquesa:#20aaa1;
  --turquesa2:#2bb8ae;
  --fundo:#effaf8;
  --texto:#53676a;
}


/* =========================================================
   HOME
========================================================= */

.home{
  min-height:100vh;
  overflow:hidden;
}


/* =========================================================
   HEADER
========================================================= */

.home-header{
  height:94px;
  background:#fff;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 6%;

  position:relative;
  z-index:100;

  border-bottom:1px solid #edf2f2;
}

.home-brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.home-paw-logo{
  font-size:43px;
  transform:rotate(-15deg);
}

.home-brand-content{
  display:flex;
  flex-direction:column;
}

.home-brand-name{
  font-size:31px;
  font-weight:900;
  letter-spacing:-1.5px;
  color:var(--verde);
}

.home-brand-name span{
  color:var(--turquesa);
}

.home-brand-sub{
  font-size:16px;
  color:#788487;
  margin-top:2px;
}

.menu-button{
  width:52px;
  height:52px;

  border:0;
  background:transparent;

  cursor:pointer;

  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:6px;
}

.menu-button span{
  width:38px;
  height:4px;
  border-radius:5px;
  background:#0b3034;
}

.menu-panel{
  display:none;

  position:absolute;

  right:5%;
  top:82px;

  background:#fff;

  border-radius:18px;

  padding:10px;

  box-shadow:
    0 15px 45px rgba(0,0,0,.16);
}

.menu-panel.open{
  display:block;
}

.menu-panel a{
  display:block;

  padding:16px 24px;

  color:var(--verde);

  font-weight:800;

  border-radius:12px;
}

.menu-panel a:hover{
  background:#eaf8f6;
}


/* =========================================================
   HERO — ESTRUTURA PRINCIPAL
========================================================= */

.hero-home{
  position:relative;

  height:850px;

  background:
    linear-gradient(
      105deg,
      #ffffff 0%,
      #f4fbfa 42%,
      #e9f8f6 72%,
      #edf8f6 100%
    );

  overflow:hidden;
}


/* luz decorativa */

.hero-home::before{
  content:"";

  position:absolute;

  width:650px;
  height:650px;

  left:-300px;
  top:100px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(35,176,166,.16),
      rgba(35,176,166,0) 70%
    );
}


/* =========================================================
   HERO CONTAINER
========================================================= */

.hero-inner{
  position:relative;

  width:100%;
  max-width:1450px;

  height:100%;

  margin:auto;
}


/* =========================================================
   TEXTO
========================================================= */

.hero-copy{
  position:absolute;

  z-index:20;

  left:6%;
  top:50px;

  width:54%;

  max-width:700px;
}

.hero-pill{
  display:inline-flex;
  align-items:center;
  gap:9px;

  background:#ddf5f1;

  color:#196762;

  padding:10px 18px;

  border-radius:50px;

  font-size:17px;
  font-weight:700;

  margin-bottom:30px;
}

.hero-pill-icon{
  width:28px;
  height:28px;

  border-radius:50%;

  background:#31a89e;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
}

.hero-title{
  color:var(--verde);

  font-size:68px;

  line-height:.95;

  letter-spacing:-3.5px;

  font-weight:900;
}

.hero-title .green{
  display:block;
  color:var(--turquesa);
}

.hero-paw{
  display:inline-block;

  font-size:32px;

  margin-left:5px;

  transform:rotate(-15deg);
}

.hero-description{
  max-width:590px;

  margin-top:28px;

  color:#506468;

  font-size:20px;

  line-height:1.48;
}

.btn-principal{
  display:flex;
  align-items:center;
  justify-content:center;

  width:385px;

  height:67px;

  margin-top:30px;

  border-radius:40px;

  background:
    linear-gradient(
      135deg,
      #2bb7ad,
      #1ca29a
    );

  color:#fff;

  font-size:21px;

  font-weight:900;

  box-shadow:
    0 12px 30px rgba(30,166,157,.25);

  transition:.2s;
}

.btn-principal:hover{
  transform:translateY(-2px);
}

.btn-principal .cart{
  font-size:27px;
  margin-right:15px;
}

.btn-principal .arrow{
  font-size:34px;
  margin-left:20px;
}


/* =========================================================
   CACHORRO — AGORA FICA NA LATERAL
========================================================= */

.hero-dog{
  position:absolute;

  z-index:5;

  right:0;
  bottom:0;

  width:58%;
  height:100%;

  object-fit:cover;

  object-position:center top;

  border-radius:0;

  /* suaviza a entrada da imagem no lado esquerdo */
  -webkit-mask-image:
    linear-gradient(
      to right,
      transparent 0%,
      rgba(0,0,0,.35) 10%,
      black 22%,
      black 100%
    );

  mask-image:
    linear-gradient(
      to right,
      transparent 0%,
      rgba(0,0,0,.35) 10%,
      black 22%,
      black 100%
    );
}


/* =========================================================
   FRASE DA HISTÓRIA
========================================================= */

.story-note{
  position:absolute;

  z-index:30;

  right:4%;
  top:38px;

  width:190px;

  text-align:center;

  color:#14726b;

  font-family:
    "Trebuchet MS",
    Arial,
    sans-serif;

  font-size:21px;

  line-height:1.18;

  font-weight:800;

  transform:rotate(-3deg);
}

.story-note .heart{
  display:block;

  font-size:48px;

  line-height:1;

  margin-bottom:5px;
}


/* =========================================================
   TAG
========================================================= */

.physical-tag{
  position:absolute;

  z-index:35;

  right:23%;
  bottom:145px;

  width:92px;
  height:92px;

  border-radius:50%;

  background:#fff;

  border:5px solid #fff;

  box-shadow:
    0 8px 22px rgba(0,0,0,.20);

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  color:#17716b;

  transform:rotate(-4deg);
}

.physical-tag-ring{
  position:absolute;

  width:20px;
  height:20px;

  top:-16px;

  border:5px solid #fff;

  border-radius:50%;

  background:transparent;
}

.physical-tag-paw{
  font-size:25px;
  line-height:1;
}

.physical-tag-text{
  font-size:9px;
  font-weight:900;

  margin-top:4px;
}

.physical-tag-heart{
  font-size:13px;
}


/* =========================================================
   SETA DA TAG
========================================================= */

.tag-arrow{
  position:absolute;

  z-index:40;

  right:15%;
  bottom:170px;

  color:#fff;

  font-size:43px;

  transform:rotate(-20deg);
}


/* =========================================================
   BALÃO TAG
========================================================= */

.tag-note{
  position:absolute;

  z-index:35;

  right:2%;
  bottom:86px;

  width:175px;

  background:#fff;

  color:#216b65;

  border-radius:20px;

  padding:15px 17px;

  text-align:center;

  font-size:16px;

  line-height:1.2;

  font-weight:900;

  box-shadow:
    0 8px 24px rgba(0,0,0,.12);

  transform:rotate(-5deg);
}


/* =========================================================
   BALÃO CELULAR
========================================================= */

.phone-note{
  position:absolute;

  z-index:35;

  right:2%;
  bottom:4px;

  width:205px;

  background:#fff;

  color:#254447;

  border-radius:20px;

  padding:15px;

  text-align:center;

  font-size:15px;

  line-height:1.25;

  font-weight:800;

  box-shadow:
    0 8px 24px rgba(0,0,0,.12);

  transform:rotate(-5deg);
}


/* =========================================================
   BENEFÍCIOS
========================================================= */

.quick-benefits{
  position:absolute;

  z-index:30;

  left:6%;

  bottom:25px;

  width:54%;

  max-width:630px;

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:18px;
}

.quick-benefit{
  text-align:center;
}

.quick-icon{
  width:65px;
  height:65px;

  margin:0 auto 9px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:30px;
}

.quick-benefit:nth-child(1) .quick-icon{
  background:#dff7f3;
}

.quick-benefit:nth-child(2) .quick-icon{
  background:#e7f1ff;
}

.quick-benefit:nth-child(3) .quick-icon{
  background:#fff0f5;
}

.quick-benefit strong{
  display:block;

  color:#213c3f;

  font-size:16px;

  line-height:1.18;
}


/* =========================================================
   PERFIL DIGITAL
========================================================= */

.profile-showcase{
  position:relative;

  z-index:50;

  max-width:1360px;

  margin:-1px auto 0;

  background:#fff;

  border-radius:40px 40px 0 0;

  padding:48px 55px 55px;

  box-shadow:
    0 -8px 35px rgba(0,0,0,.04);
}

.profile-title{
  text-align:center;
}

.profile-title h2{
  font-size:47px;

  line-height:1;

  color:var(--verde);

  font-weight:900;

  letter-spacing:-2px;
}

.profile-title p{
  margin-top:13px;

  color:#5b6c6f;

  font-size:22px;
}

.profile-title p span{
  color:#fa5d78;
}


/* =========================================================
   FOTOS
========================================================= */

.photo-collage{
  max-width:1000px;

  margin:35px auto 30px;

  display:grid;

  grid-template-columns:1fr 1.35fr 1fr;

  gap:13px;

  align-items:center;
}

.photo-collage img{
  width:100%;

  display:block;

  object-fit:cover;

  border-radius:23px;
}

.photo-left{
  height:230px;

  transform:rotate(-5deg);
}

.photo-center{
  height:285px;
}

.photo-right{
  display:grid;

  gap:10px;
}

.photo-right img{
  height:137px;
}

.photo-right img:first-child{
  transform:rotate(3deg);
}

.photo-right img:last-child{
  transform:rotate(-3deg);
}


/* =========================================================
   CARDS DE FUNÇÕES
========================================================= */

.feature-grid{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:18px;

  margin-top:32px;
}

.feature-card{
  min-height:135px;

  border-radius:25px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  text-align:center;
}

.feature-card:nth-child(1){
  background:#e3f7f3;
}

.feature-card:nth-child(2){
  background:#eaf3ff;
}

.feature-card:nth-child(3){
  background:#fff0f4;
}

.feature-card:nth-child(4){
  background:#fff8df;
}

.feature-icon{
  font-size:39px;

  margin-bottom:9px;
}

.feature-card strong{
  font-size:17px;

  line-height:1.2;

  color:#203c3f;
}


/* =========================================================
   COMO FUNCIONA
========================================================= */

.section{
  max-width:1250px;

  margin:auto;

  padding:90px 25px;
}

.section-title{
  text-align:center;

  font-size:45px;

  color:var(--verde);

  margin-bottom:45px;
}

.steps{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:25px;
}

.step{
  background:#fff;

  border-radius:25px;

  padding:30px;

  text-align:center;

  box-shadow:
    0 10px 35px rgba(0,0,0,.05);
}

.step-number{
  width:55px;
  height:55px;

  border-radius:50%;

  background:#ddf5f1;

  color:#15746e;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0 auto 18px;

  font-size:22px;

  font-weight:900;
}

.step h3{
  color:var(--verde);

  margin-bottom:10px;
}

.step p{
  color:#657477;

  line-height:1.5;
}


/* =========================================================
   FOOTER
========================================================= */

.home-footer{
  background:#103b3d;

  color:#fff;

  text-align:center;

  padding:35px 20px;
}

.home-footer strong{
  font-size:18px;
}

.home-footer p{
  margin-top:8px;

  color:#c4d6d6;
}


/* =========================================================
   MOBILE
   AQUI ESTÁ A PRINCIPAL CORREÇÃO
========================================================= */

@media(max-width:900px){

  .home-header{
    height:78px;

    padding:0 18px;
  }

  .home-paw-logo{
    font-size:32px;
  }

  .home-brand-name{
    font-size:25px;
  }

  .home-brand-sub{
    font-size:12px;
  }


  /* ---------------------------------------------
     HERO NÃO EMPILHA
  --------------------------------------------- */

  .hero-home{
    height:790px;
  }

  .hero-inner{
    height:100%;

    width:100%;
  }


  /* ---------------------------------------------
     CACHORRO FICA NA DIREITA
  --------------------------------------------- */

  .hero-dog{
    right:0;

    width:59%;

    object-position:
      62% top;

    -webkit-mask-image:
      linear-gradient(
        to right,
        transparent 0%,
        rgba(0,0,0,.35) 7%,
        black 22%,
        black 100%
      );

    mask-image:
      linear-gradient(
        to right,
        transparent 0%,
        rgba(0,0,0,.35) 7%,
        black 22%,
        black 100%
      );
  }


  /* ---------------------------------------------

  --------------------------------------------- */

  .hero-copy{

  }

  .hero-pill{
    font-size:12px;

    margin-bottom:19px;

    gap:5px;
  }

    height:22px;

    font-size:12px;
  }

  .hero-title{
    font-size:43px;

    letter-spacing:-2.3px;

    line-height:.96;
  }

  .hero-paw{
    font-size:23px;
  }

  .hero-description{
    width:95%;

    margin-top:20px;

    font-size:15px;

    line-height:1.4;
  }

  .btn-principal{
    width:100%;

    height:58px;

    margin-top:21px;

    font-size:16px;

    padding:0 10px;
  }

  .btn-principal .cart{
    font-size:21px;

    margin-right:7px;
  }

  }

  --------------------------------------------- */

  .quick-benefits{
    left:15px;

  }

  }

  .story-note{

  }

  }


  /* ---------------------------------------------
     TAG
  --------------------------------------------- */

  .physical-tag{
    right:18%;

    bottom:135px;

  }

  .physical-tag-ring{

    height:16px;

    top:-12px;

  }

  .physical-tag-paw{
    font-size:19px;
  }

  .physical-tag-text{
    font-size:7px;
  }

  }

    right:10%;

    bottom:153px;

  }


  /* ---------------------------------------------
     BALÃO TAG
  --------------------------------------------- */

  .tag-note{

  }


  /* ---------------------------------------------
     BALÃO CELULAR
  --------------------------------------------- */

  .phone-note{

  }

  .profile-title p{
    font-size:17px;
  }

    grid-template-columns:1fr 1.35fr 1fr;

    gap:6px;

    margin-top:28px;
  }

  .photo-collage img{

  }

  .photo-left{
    height:160px;
  }

  .photo-center{

  }

  }

  }


  /* ---------------------------------------------
     FEATURES

  }

    padding:10px;
  }

  .feature-icon{
    font-size:30px;

    margin-bottom:6px;
  }

  .feature-card strong{
    font-size:13px;
  }


  .section{
    padding:65px 18px;
  }

  .section-title{
    font-size:34px;
  }

  .steps{
    grid-template-columns:1fr;
  }

}


/* =========================================================
   CELULAR PEQUENO
========================================================= */

@media(max-width:390px){

  .hero-home{
    height:760px;
  }

  .hero-copy{
    left:17px;

    width:61%;
  }

  .hero-title{
    font-size:39px;
  }

  .hero-description{
    font-size:14px;
  }

  .btn-principal{
    font-size:14px;
  }

  .hero-dog{
    width:57%;
  }

  .quick-benefit strong{

  }

}


/* =========================================================
   PERFIL PÚBLICO
========================================================= */

.public-page{
  min-height:100vh;

  background:#f5fbfa;
}

.public-header{
  background:#fff;

  padding:18px;

  text-align:center;

  border-bottom:1px solid #e8eeee;
}

.public-header h1{
  color:var(--verde);
}

.public-container{
  max-width:650px;

  margin:30px auto;

  padding:0 20px 50px;
}

.public-card{
  background:#fff;

  border-radius:30px;

  padding:30px;

  box-shadow:
    0 12px 35px rgba(0,0,0,.06);
}

.pet-photo{
  width:170px;
  height:170px;

  object-fit:cover;

  border-radius:50%;

  display:block;

  margin:0 auto 20px;
}

.pet-name{
  text-align:center;

  font-size:32px;

  color:var(--verde);
}

.pet-status{
  text-align:center;

  margin:15px 0 25px;
}

.info-list{
  display:grid;

  gap:10px;
}

.info-item{
  background:#f5faf9;

  border-radius:13px;

  padding:13px 15px;
}

.info-item strong{
  color:var(--verde);
}

.contact-buttons{
  display:grid;

  gap:10px;

  margin-top:20px;
}

.contact-button{
  display:flex;

  align-items:center;
  justify-content:center;

  padding:14px;

  border-radius:14px;

  font-weight:800;
}

.whatsapp{
  background:#25d366;

  color:#fff;
}

.call{
  background:#e5f4ff;

  color:#135f8c;
}

.lost-card{
  background:#fff1f1;

  border:2px solid #ffd0d0;

  border-radius:20px;

  padding:20px;

  margin-top:20px;
}

.tutor-area{
  text-align:center;

  margin-top:35px;
}

.tutor-area a{
  color:#5d7779;

  font-size:14px;
}

.loading{
  text-align:center;

  padding:50px 20px;

  color:#687779;
}

.erro{
  text-align:center;

  padding:50px 20px;

  color:#a32929;
}

</style>

</head>


<body>

<div id="app">

  <div
    id="loading"
    class="loading"
  >
    Carregando...
  </div>

  <div
    id="erro"
    class="erro"
    style="display:none;"
  >
    Pet não encontrado.
  </div>

  <div
    id="ativacao"
    style="display:none;"
  ></div>

  <div
    id="conteudo"
    style="display:none;"
  ></div>

</div>

/* =========================================================

const SUPABASE_URL =

/*
   COLOQUE AQUI A MESMA PUBLISHABLE KEY

*/

const SUPABASE_KEY =
  "sb_publishable_JV-XGEU9DeEG2ZfjGbUw1g_ul0dflll";


/* =========================================================
   CLIENTE
========================================================= */

const supabaseClient = {

  async rpc(funcao,parametros={}){

    const resposta =
      await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/${funcao}`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_KEY}`
          },

          body:
            JSON.stringify(parametros)
        }
      );


    const texto =
      await resposta.text();


    let data=null;


    try{

      data =
        texto
          ? JSON.parse(texto)
          : null;

    }catch(e){

      data=texto;

    }


    if(!resposta.ok){

      throw new Error(
        data?.message ||
        data?.error ||
        "Erro na comunicação com o servidor."
      );

    }


    return{
      data,
      error:null
    };

  }

};

/* =========================================================

async function carregarPetPublico(){

  try{

    loading.style.display="block";


    const resultado =
      await supabaseClient.rpc(
        "get_pet_public",
        {
          p_codigo:codigo
        }
      );


    if(
      resultado.error ||
      !resultado.data ||
      (
        Array.isArray(resultado.data) &&
        resultado.data.length===0
      )
    ){

      loading.style.display="none";

      erro.style.display="block";

      return;

    }


    const pet =
      Array.isArray(resultado.data)
        ? resultado.data[0]
        : resultado.data;


    preencherPagina(pet);


  }catch(error){

    console.error(error);

    loading.style.display="none";

    erro.style.display="block";

  }

}
