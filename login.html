<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Tag Pet | Entrar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f7f6;
  color:#172b2b;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:100%;
  max-width:430px;
  padding:20px;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:800;
  color:#ffffff;
  background:#102b45;
  padding:28px 10px;
  border-radius:20px 20px 0 0;
}

.logo span{
  color:#54d36b;
}

.subtitle{
  text-align:center;
  color:#ffffff;
  background:#102b45;
  padding:0 10px 25px;
  font-weight:bold;
  letter-spacing:1px;
}

.card{
  background:white;
  padding:28px;
  border-radius:0 0 20px 20px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}

h2{
  margin-top:0;
  text-align:center;
}

label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d5dddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#54d36b;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#102b45;
}

.link{
  text-align:center;
  margin-top:18px;
  color:#102b45;
  cursor:pointer;
  font-weight:bold;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  text-align:center;
  display:none;
}

.success{
  display:block;
  background:#e4f8e8;
  color:#17652a;
}

.error{
  display:block;
  background:#fde8e8;
  color:#a32222;
}

.hidden{
  display:none;
}

.voltar{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#102b45;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    Save Tag <span>Pet</span>
  </div>

  <div class="subtitle">
    IDENTIFICAÇÃO INTELIGENTE
  </div>

  <div class="card">

    <!-- LOGIN -->
    <div id="loginBox">

      <h2>Entrar na sua conta</h2>

      <label>E-mail</label>
      <input id="loginEmail" type="email" placeholder="seu@email.com">

      <label>Senha</label>
      <input id="loginSenha" type="password" placeholder="Sua senha">

      <button onclick="entrar()">Entrar</button>

      <div id="loginMessage" class="message"></div>

      <div class="link" onclick="mostrarCadastro()">
        Ainda não tenho uma conta
      </div>

    </div>


    <!-- CADASTRO -->
    <div id="cadastroBox" class="hidden">

      <h2>Criar minha conta</h2>

      <label>Nome</label>
      <input id="cadNome" type="text" placeholder="Seu nome">

      <label>E-mail</label>
      <input id="cadEmail" type="email" placeholder="seu@email.com">

      <label>Telefone</label>
      <input id="cadTelefone" type="tel" placeholder="(13) 99999-9999">

      <label>Cidade</label>
      <input id="cadCidade" type="text" placeholder="Praia Grande">

      <label>Senha</label>
      <input id="cadSenha" type="password" placeholder="Mínimo 6 caracteres">

      <button onclick="cadastrar()">Criar conta</button>

      <div id="cadMessage" class="message"></div>

      <div class="link" onclick="mostrarLogin()">
        Já tenho uma conta
      </div>

    </div>

    <a class="voltar" href="index.html">
      ← Voltar para o site
    </a>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

/*
   IMPORTANTE:
   NÃO invente esses dois valores.

   Mantenha aqui os mesmos valores que você já colocou
   anteriormente no seu login.html:
*/

const SUPABASE_URL = "https://mqiwoubhivutavpnpeax.supabase.co";
const SUPABASE_KEY = "sb_publishable_JV-XGEU9DeEG2ZfjGbUw1g_ul0dflll";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ALTERNAR LOGIN / CADASTRO
   ===================================================== */

function mostrarCadastro(){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("cadastroBox")
    .classList.remove("hidden");

}


function mostrarLogin(){

  document.getElementById("cadastroBox")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");

}


/* =====================================================
   LOGIN
   ===================================================== */

async function entrar(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const senha =
    document.getElementById("loginSenha").value;

  const msg =
    document.getElementById("loginMessage");

  msg.className = "message";
  msg.textContent = "";

  if(!email || !senha){

    msg.className = "message error";
    msg.textContent = "Informe seu e-mail e sua senha.";
    return;

  }

  const { data, error } =
    await supabase.auth.signInWithPassword({
      email: email,
      password: senha
    });

  if(error){

    msg.className = "message error";
    msg.textContent =
      "E-mail ou senha incorretos.";
    return;

  }

  msg.className = "message success";
  msg.textContent =
    "Login realizado com sucesso!";

}


/* =====================================================
   CADASTRO
   ===================================================== */

async function cadastrar(){

  const nome =
    document.getElementById("cadNome").value.trim();

  const email =
    document.getElementById("cadEmail").value.trim();

  const telefone =
    document.getElementById("cadTelefone").value.trim();

  const cidade =
    document.getElementById("cadCidade").value.trim();

  const senha =
    document.getElementById("cadSenha").value;

  const msg =
    document.getElementById("cadMessage");

  msg.className = "message";
  msg.textContent = "";

  if(!nome || !email || !senha){

    msg.className = "message error";
    msg.textContent =
      "Preencha nome, e-mail e senha.";

    return;

  }

  if(senha.length < 6){

    msg.className = "message error";
    msg.textContent =
      "A senha precisa ter pelo menos 6 caracteres.";

    return;

  }


  const { data, error } =
    await supabase.auth.signUp({

      email: email,
      password: senha,

      options:{
        data:{
          nome: nome
        }
      }

    });


  if(error){

    msg.className = "message error";
    msg.textContent = error.message;
    return;

  }


  /*
     Se o Supabase já criar a sessão,
     cadastramos também os dados do tutor.
  */

  if(data.session){

    const user = data.user;

    const { error: tutorError } =
      await supabase
        .from("tutores")
        .insert({

          id: user.id,
          nome: nome,
          telefone: telefone,
          email: email,
          cidade: cidade

        });


    if(tutorError){

      console.error(tutorError);

    }

  }


  msg.className = "message success";

  msg.textContent =
    "Conta criada! Verifique seu e-mail para confirmar o cadastro, caso o Supabase solicite.";


}


/* =====================================================
   VERIFICAR SESSÃO
   ===================================================== */

supabase.auth.getSession()
.then(({ data }) => {

  if(data.session){

    console.log(
      "Usuário já está logado:",
      data.session.user.email
    );

  }

});

</script>

</body>
</html>
