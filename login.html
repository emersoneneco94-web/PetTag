<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Save Tag Pet | Entrar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f3f7f5;

    color:#172b2f;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.container{

    width:100%;

    max-width:430px;

}

.logo{

    text-align:center;

    margin-bottom:25px;

}

.logo h1{

    margin:0;

    font-size:34px;

    font-weight:800;

}

.logo h1 span{

    color:#21a366;

}

.logo p{

    margin:8px 0 0;

    font-size:12px;

    letter-spacing:2px;

    color:#687779;

}


/* =========================
   ATIVAÇÃO
========================= */

.ativacao{

    background:#e8f6ee;

    border:1px solid #c7e9d5;

    border-radius:16px;

    padding:18px;

    margin-bottom:16px;

    text-align:center;

}

.ativacao .icone{

    font-size:30px;

    margin-bottom:6px;

}

.ativacao h3{

    margin:0 0 7px;

    color:#17643e;

    font-size:19px;

}

.ativacao p{

    margin:5px 0;

    color:#4d6258;

    font-size:14px;

    line-height:1.5;

}

.codigo{

    display:inline-block;

    margin-top:7px;

    padding:8px 14px;

    background:white;

    border-radius:9px;

    color:#173d2d;

    font-size:17px;

    font-weight:800;

    letter-spacing:1px;

}


/* =========================
   CARD
========================= */

.card{

    background:#fff;

    border-radius:22px;

    padding:30px 25px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.08);

}

h2{

    text-align:center;

    margin:0 0 25px;

    font-size:24px;

}

label{

    display:block;

    margin:15px 0 7px;

    font-size:14px;

    font-weight:bold;

}

input{

    width:100%;

    padding:14px;

    border:1px solid #d7dfdc;

    border-radius:10px;

    font-size:16px;

    outline:none;

}

input:focus{

    border-color:#21a366;

}

button{

    width:100%;

    margin-top:22px;

    padding:15px;

    border:0;

    border-radius:11px;

    background:#21a366;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}

button:hover{

    background:#198b55;

}

button:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.link{

    text-align:center;

    margin-top:18px;

    color:#21a366;

    font-weight:bold;

    font-size:14px;

    cursor:pointer;

}

.link:hover{

    text-decoration:underline;

}

.voltar{

    display:block;

    text-align:center;

    margin-top:22px;

    color:#687779;

    text-decoration:none;

    font-size:14px;

}

.hidden{

    display:none !important;

}

.mensagem{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:14px;

    line-height:1.4;

}

.mensagem.sucesso{

    display:block;

    background:#e8f7ef;

    color:#187443;

}

.mensagem.erro{

    display:block;

    background:#fdecec;

    color:#a52b2b;

}

.mensagem.info{

    display:block;

    background:#eef5f7;

    color:#28545d;

}

</style>

</head>


<body>


<div class="container">


    <!-- LOGO -->

    <div class="logo">

        <h1>
            Save Tag <span>Pet</span>
        </h1>

        <p>
            IDENTIFICAÇÃO INTELIGENTE
        </p>

    </div>


    <!-- =========================
         ATIVAÇÃO DA TAG
    ========================== -->

    <div
        id="ativacaoBox"
        class="ativacao hidden"
    >

        <div class="icone">
            🐾
        </div>

        <h3>
            Ativação da sua TAG
        </h3>

        <p>
            Você está ativando uma TAG Save Tag Pet.
        </p>

        <p>
            Depois do login, vamos continuar a ativação.
        </p>

        <div
            id="codigoTag"
            class="codigo"
        >
            TAG
        </div>

    </div>


    <!-- CARD -->

    <div class="card">


        <!-- =========================
             LOGIN
        ========================== -->

        <div id="loginBox">

            <h2>
                Entrar na sua conta
            </h2>


            <label>
                E-mail
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="seu@email.com"
                autocomplete="email"
            >


            <label>
                Senha
            </label>

            <input
                id="loginSenha"
                type="password"
                placeholder="Sua senha"
                autocomplete="current-password"
            >


            <button
                id="btnEntrar"
                type="button"
                onclick="entrar()"
            >
                Entrar
            </button>


            <button
                type="button"
                onclick="recuperarSenha()"
                style="
                    background:none;
                    border:none;
                    color:#19a765;
                    cursor:pointer;
                    font-size:15px;
                    margin-top:12px;
                "
            >
                🔑 Esqueci minha senha
            </button>


            <div
                id="mensagemLogin"
                class="mensagem"
            >
            </div>


            <div
                class="link"
                onclick="mostrarCadastro()"
            >
                Ainda não tenho uma conta
            </div>

        </div>


        <!-- =========================
             CADASTRO
        ========================== -->

        <div
            id="cadastroBox"
            class="hidden"
        >

            <h2>
                Criar minha conta
            </h2>


            <label>
                Nome
            </label>

            <input
                id="nome"
                type="text"
                placeholder="Seu nome"
                autocomplete="name"
            >


            <label>
                E-mail
            </label>

            <input
                id="cadastroEmail"
                type="email"
                placeholder="seu@email.com"
                autocomplete="email"
            >


            <label>
                WhatsApp / Telefone
            </label>

            <input
                id="telefone"
                type="tel"
                placeholder="(13) 99999-9999"
                autocomplete="tel"
            >


            <label>
                Cidade
            </label>

            <input
                id="cidade"
                type="text"
                placeholder="Sua cidade"
                autocomplete="address-level2"
            >


            <label>
                Senha
            </label>

            <input
                id="cadastroSenha"
                type="password"
                placeholder="Mínimo de 6 caracteres"
                autocomplete="new-password"
            >


            <button
                id="btnCadastrar"
                type="button"
                onclick="cadastrar()"
            >
                Criar conta
            </button>


            <div
                id="mensagemCadastro"
                class="mensagem"
            >
            </div>


            <div
                class="link"
                onclick="mostrarLogin()"
            >
                ← Já tenho uma conta
            </div>

        </div>

    </div>


    <a
        class="voltar"
        href="index.html"
    >
        ← Voltar para o site
    </a>

</div>



<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mqiwoubhivutavpnpeax.supabase.co";


/*
    COLOQUE AQUI A MESMA PUBLISHABLE KEY
    QUE JÁ ESTÁ NO SEU login.html ATUAL.
*/

const SUPABASE_KEY =
"sb_publishable_JV-XGEU9DeEG2ZfjGbUw1g_ul0dflll";


let supabaseClient = null;



/* =====================================================
   IDENTIFICAR TAG
===================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const codigoTag =
    parametros.get("tag");



/* =====================================================
   MOSTRAR INFORMAÇÃO DA TAG
===================================================== */

function mostrarInformacaoTag(){

    if(!codigoTag){

        return;

    }


    document
        .getElementById("ativacaoBox")
        .classList
        .remove("hidden");


    document
        .getElementById("codigoTag")
        .textContent =
            codigoTag;

}



/* =====================================================
   ABRIR CADASTRO
===================================================== */

function mostrarCadastro(){

    document
        .getElementById("loginBox")
        .classList
        .add("hidden");


    document
        .getElementById("cadastroBox")
        .classList
        .remove("hidden");


    limparMensagens();

}



/* =====================================================
   VOLTAR PARA LOGIN
===================================================== */

function mostrarLogin(){

    document
        .getElementById("cadastroBox")
        .classList
        .add("hidden");


    document
        .getElementById("loginBox")
        .classList
        .remove("hidden");


    limparMensagens();

}



/* =====================================================
   LIMPAR MENSAGENS
===================================================== */

function limparMensagens(){

    const login =
        document.getElementById(
            "mensagemLogin"
        );


    const cadastro =
        document.getElementById(
            "mensagemCadastro"
        );


    login.textContent = "";

    login.className =
        "mensagem";


    cadastro.textContent = "";

    cadastro.className =
        "mensagem";

}



/* =====================================================
   MENSAGEM
===================================================== */

function mensagem(
    id,
    texto,
    tipo
){

    const elemento =
        document.getElementById(id);


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " + tipo;

}



/* =====================================================
   INICIAR SUPABASE
===================================================== */

function iniciarSupabase(){

    try{

        if(
            window.supabase &&
            typeof window.supabase.createClient ===
            "function"
        ){

            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );


            console.log(
                "Supabase conectado."
            );

        }else{

            console.log(
                "Supabase ainda não carregou."
            );

        }

    }catch(erro){

        console.error(
            "Erro Supabase:",
            erro
        );

    }

}



/* =====================================================
   DESTINO APÓS LOGIN
===================================================== */

function continuarAposLogin(){

    /*
       Se o login veio de uma TAG,
       mantém o código da TAG.
    */

    if(codigoTag){

        window.location.href =
            "painel.html?tag=" +
            encodeURIComponent(codigoTag);

        return;

    }


    /*
       Login normal sem TAG.
    */

    window.location.href =
        "painel.html";

}



/* =====================================================
   LOGIN
===================================================== */

async function entrar(){

    limparMensagens();

    if(!supabaseClient){

        mensagem(
            "mensagemLogin",
            "Não foi possível conectar ao sistema. Atualize a página e tente novamente.",
            "erro"
        );

        return;
    }

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const senha =
        document
        .getElementById("loginSenha")
        .value;

    if(!email || !senha){

        mensagem(
            "mensagemLogin",
            "Digite seu e-mail e sua senha.",
            "erro"
        );

        return;
    }

    const botao =
        document.getElementById("btnEntrar");

    botao.disabled = true;
    botao.textContent = "Entrando...";

    try{

        const resultado =
            await supabaseClient
            .auth
            .signInWithPassword({

                email: email,
                password: senha

            });

        if(resultado.error){

            mensagem(
                "mensagemLogin",
                resultado.error.message,
                "erro"
            );

            return;
        }

        mensagem(
            "mensagemLogin",
            "Login realizado com sucesso!",
            "sucesso"
        );

        setTimeout(
            function(){

                continuarAposLogin();

            },
            700
        );

    }catch(erro){

        console.error(erro);

        mensagem(
            "mensagemLogin",
            "Erro ao entrar. Tente novamente.",
            "erro"
        );

    }finally{

        botao.disabled = false;
        botao.textContent = "Entrar";

    }

}


    const botao =
        document.getElementById(
            "btnEntrar"
        );


    botao.disabled = true;

    botao.textContent =
        "Entrando...";


    try{

        const urlConfirmacao =
    new URL(
        "https://save-tag-pet.vercel.app/login.html"
    );

if(codigoTag){

    urlConfirmacao.searchParams.set(
        "tag",
        codigoTag
    );

}

const resultado =
    await supabaseClient
    .auth
    .signInWithPassword({

        email:email,

        password:senha,

        
            });


        if(resultado.error){

            mensagem(
                "mensagemLogin",

                resultado.error.message,

                "erro"
            );

            return;

        }


        mensagem(
            "mensagemLogin",

            "Login realizado com sucesso!",

            "sucesso"
        );


        setTimeout(
            function(){

                continuarAposLogin();

            },
            700
        );


    }catch(erro){

        console.error(erro);


        mensagem(
            "mensagemLogin",

            "Erro ao entrar. Tente novamente.",

            "erro"
        );


    }finally{

        botao.disabled = false;

        botao.textContent =
            "Entrar";

    }

}



/* =====================================================
   CADASTRO
===================================================== */

async function cadastrar(){

    limparMensagens();


    if(!supabaseClient){

        mensagem(
            "mensagemCadastro",

            "Não foi possível conectar ao sistema. Atualize a página e tente novamente.",

            "erro"
        );

        return;

    }


    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const email =
        document
        .getElementById("cadastroEmail")
        .value
        .trim();


    const telefone =
        document
        .getElementById("telefone")
        .value
        .trim();


    const cidade =
        document
        .getElementById("cidade")
        .value
        .trim();


    const senha =
        document
        .getElementById("cadastroSenha")
        .value;


    if(
        !nome ||
        !email ||
        !telefone ||
        !cidade ||
        !senha
    ){

        mensagem(
            "mensagemCadastro",

            "Preencha todos os campos.",

            "erro"
        );

        return;

    }


    if(senha.length < 6){

        mensagem(
            "mensagemCadastro",

            "A senha precisa ter pelo menos 6 caracteres.",

            "erro"
        );

        return;

    }


    const botao =
        document.getElementById(
            "btnCadastrar"
        );


    botao.disabled = true;

    botao.textContent =
        "Criando conta...";


    try{

        const urlConfirmacao =
    new URL("https://save-tag-pet.vercel.app/login.html");

if(codigoTag){
    urlConfirmacao.searchParams.set("tag", codigoTag);
}

const resultado =
    await supabaseClient
    .auth
    .signUp({
        email:email,
        password:senha,
        options:{
            emailRedirectTo:
                urlConfirmacao.toString()
        }
    });


        if(resultado.error){

            mensagem(
                "mensagemCadastro",

                resultado.error.message,

                "erro"
            );

            return;

        }


        const usuario =
            resultado.data.user;


        if(!usuario){

            mensagem(
                "mensagemCadastro",

                "Não foi possível criar a conta.",

                "erro"
            );

            return;

        }



        /* =============================================
           SALVAR TUTOR
        ============================================= */

        if(resultado.data.session){

            const tutor =
                await supabaseClient
                .from("tutores")
                .insert({

                    id:usuario.id,

                    nome:nome,

                    telefone:telefone,

                    email:email,

                    cidade:cidade

                });


            if(tutor.error){

                console.error(
                    "Erro ao salvar tutor:",
                    tutor.error
                );


                mensagem(
                    "mensagemCadastro",

                    "A conta foi criada, mas os dados do tutor não foram salvos.",

                    "erro"
                );

                return;

            }


            mensagem(
                "mensagemCadastro",

                "Conta criada com sucesso!",

                "sucesso"
            );


            setTimeout(
                function(){

                    continuarAposLogin();

                },
                1000
            );


        }else{

            /*
              Caso o Supabase exija confirmação
              de e-mail, mantém a informação da TAG
              na mensagem.
            */

            if(codigoTag){

                mensagem(
                    "mensagemCadastro",

                    "Conta criada! Confirme seu e-mail. Depois, entre novamente para continuar a ativação da TAG " + codigoTag + ".",

                    "sucesso"
                );

            }else{

                mensagem(
                    "mensagemCadastro",

                    "Conta criada! Verifique seu e-mail para confirmar o cadastro.",

                    "sucesso"
                );

            }

        }


    }catch(erro){

        console.error(erro);


        mensagem(
            "mensagemCadastro",

            "Erro ao criar a conta. Tente novamente.",

            "erro"
        );


    }finally{

        botao.disabled = false;

        botao.textContent =
            "Criar conta";

    }

}



/* =====================================================
   RECUPERAR SENHA
===================================================== */

async function recuperarSenha(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    if(!email){

        mensagem(
            "mensagemLogin",

            "Digite seu e-mail para receber o link de recuperação.",

            "erro"
        );

        return;

    }


    if(!supabaseClient){

        mensagem(
            "mensagemLogin",

            "Não foi possível conectar ao sistema. Atualize a página e tente novamente.",

            "erro"
        );

        return;

    }


    try{

        const resultado =
            await supabaseClient
            .auth
            .resetPasswordForEmail(

                email,

                {
                    redirectTo:
                    "https://save-tag-pet.vercel.app/alterar-senha.html"
                }

            );


        if(resultado.error){

            mensagem(
                "mensagemLogin",

                resultado.error.message,

                "erro"
            );

            return;

        }


        mensagem(
            "mensagemLogin",

            "Enviamos um link para seu e-mail. Verifique sua caixa de entrada.",

            "sucesso"
        );


    }catch(erro){

        console.error(erro);


        mensagem(
            "mensagemLogin",

            "Não foi possível enviar o e-mail de recuperação.",

            "erro"
        );

    }

}



/* =====================================================
   INICIAR
===================================================== */

iniciarSupabase();

mostrarInformacaoTag();


</script>


</body>

</html>
