<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Save Tag Pet | Entrar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:Arial,Helvetica,sans-serif;

    background:#f3f7f5;

    color:#172b2f;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    margin:0;

    font-size:34px;
    font-weight:800;
}

.logo h1 span{
    color:#21a366;
}

.logo p{
    margin:8px 0 0;

    font-size:12px;
    letter-spacing:2px;

    color:#687779;
}

.card{
    background:#fff;

    border-radius:22px;

    padding:30px 25px;

    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h2{
    text-align:center;

    margin:0 0 25px;

    font-size:24px;
}

label{
    display:block;

    margin:15px 0 7px;

    font-size:14px;

    font-weight:bold;
}

input{
    width:100%;

    padding:14px;

    border:1px solid #d7dfdc;

    border-radius:10px;

    font-size:16px;

    outline:none;
}

input:focus{
    border-color:#21a366;
}

button{
    width:100%;

    margin-top:22px;

    padding:15px;

    border:0;

    border-radius:11px;

    background:#21a366;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

button:hover{
    background:#198b55;
}

button:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.link{
    text-align:center;

    margin-top:18px;

    color:#21a366;

    font-weight:bold;

    font-size:14px;

    cursor:pointer;
}

.link:hover{
    text-decoration:underline;
}

.voltar{
    display:block;

    text-align:center;

    margin-top:22px;

    color:#687779;

    text-decoration:none;

    font-size:14px;
}

.hidden{
    display:none !important;
}

.mensagem{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:10px;

    text-align:center;

    font-size:14px;

    line-height:1.4;
}

.mensagem.sucesso{
    display:block;

    background:#e8f7ef;

    color:#187443;
}

.mensagem.erro{
    display:block;

    background:#fdecec;

    color:#a52b2b;
}

.mensagem.info{
    display:block;

    background:#eef5f7;

    color:#28545d;
}


/* =========================================
   AVISO DE ATIVAÇÃO
========================================= */

.tag-ativacao{

    background:#e8f7ef;

    border:1px solid #c8ead7;

    border-radius:14px;

    padding:14px;

    margin-bottom:22px;

    text-align:center;
}

.tag-ativacao .icone{

    font-size:30px;

    margin-bottom:6px;
}

.tag-ativacao strong{

    display:block;

    color:#187443;

    font-size:16px;

    margin-bottom:5px;
}

.tag-ativacao span{

    display:block;

    color:#59645e;

    font-size:13px;

    line-height:1.4;
}

.tag-codigo{

    margin-top:8px;

    font-weight:bold;

    color:#173d2d;

    letter-spacing:1px;
}

</style>

</head>


<body>


<div class="container">


    <!-- LOGO -->

    <div class="logo">

        <h1>
            Save Tag <span>Pet</span>
        </h1>

        <p>
            IDENTIFICAÇÃO INTELIGENTE
        </p>

    </div>


    <!-- CARD -->

    <div class="card">


        <!-- =====================================
             AVISO DE ATIVAÇÃO
        ====================================== -->

        <div
            id="avisoAtivacao"
            class="tag-ativacao hidden"
        >

            <div class="icone">
                🐾
            </div>

            <strong>
                Ativação da sua TAG
            </strong>

            <span>
                Você está ativando uma TAG Save Tag Pet.
            </span>

            <div
                id="codigoTag"
                class="tag-codigo"
            >
                -
            </div>

        </div>


        <!-- =====================================
             LOGIN
        ====================================== -->

        <div id="loginBox">


            <h2>
                Entrar na sua conta
            </h2>


            <label>
                E-mail
            </label>


            <input
                id="loginEmail"
                type="email"
                placeholder="seu@email.com"
                autocomplete="email"
            >


            <label>
                Senha
            </label>


            <input
                id="loginSenha"
                type="password"
                placeholder="Sua senha"
                autocomplete="current-password"
            >


            <button
                id="btnEntrar"
                type="button"
                onclick="entrar()"
            >
                Entrar
            </button>


            <button
                type="button"
                onclick="recuperarSenha()"
                style="
                    background:none;
                    border:none;
                    color:#19a765;
                    cursor:pointer;
                    font-size:15px;
                    margin-top:12px;
                "
            >
                🔑 Esqueci minha senha
            </button>


            <div
                id="mensagemLogin"
                class="mensagem"
            >
            </div>


            <div
                class="link"
                onclick="mostrarCadastro()"
            >
                Ainda não tenho uma conta
            </div>

        </div>


        <!-- =====================================
             CADASTRO
        ====================================== -->

        <div
            id="cadastroBox"
            class="hidden"
        >


            <h2>
                Criar minha conta
            </h2>


            <label>
                Nome
            </label>


            <input
                id="nome"
                type="text"
                placeholder="Seu nome"
                autocomplete="name"
            >


            <label>
                E-mail
            </label>


            <input
                id="cadastroEmail"
                type="email"
                placeholder="seu@email.com"
                autocomplete="email"
            >


            <label>
                WhatsApp / Telefone
            </label>


            <input
                id="telefone"
                type="tel"
                placeholder="(13) 99999-9999"
                autocomplete="tel"
            >


            <label>
                Cidade
            </label>


            <input
                id="cidade"
                type="text"
                placeholder="Sua cidade"
                autocomplete="address-level2"
            >


            <label>
                Senha
            </label>


            <input
                id="cadastroSenha"
                type="password"
                placeholder="Mínimo de 6 caracteres"
                autocomplete="new-password"
            >


            <button
                id="btnCadastrar"
                type="button"
                onclick="cadastrar()"
            >
                Criar conta
            </button>


            <div
                id="mensagemCadastro"
                class="mensagem"
            >
            </div>


            <div
                class="link"
                onclick="mostrarLogin()"
            >
                ← Já tenho uma conta
            </div>

        </div>

    </div>


    <a
        class="voltar"
        href="index.html"
    >
        ← Voltar para o site
    </a>

</div>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mqiwoubhivutavpnpeax.supabase.co";


/*
   IMPORTANTE:

   Use aqui a MESMA Publishable Key
   que já estava no seu login.html atual.
*/

const SUPABASE_KEY =
"sb_publishable_JV-XGEU9DeEG2ZfjGbUw1g_ul0dflll";


let supabaseClient = null;


/* =====================================================
   IDENTIFICAR TAG
===================================================== */

const parametros =
    new URLSearchParams(
        window.location.search
    );


let tagCodigo =
    parametros.get("tag");


/*
   Se existir uma TAG na URL,
   salva no navegador.

   Isso permite preservar a TAG
   durante o cadastro e confirmação
   de e-mail.
*/

if(tagCodigo){

    tagCodigo =
        tagCodigo
        .trim()
        .toUpperCase();

    localStorage.setItem(
        "save_tag_pet_ativacao",
        tagCodigo
    );

}


/*
   Se não veio TAG na URL,
   tenta recuperar a última TAG
   que estava sendo ativada.
*/

if(!tagCodigo){

    tagCodigo =
        localStorage.getItem(
            "save_tag_pet_ativacao"
        );

}


/* =====================================================
   MOSTRAR AVISO DA TAG
===================================================== */

function mostrarAvisoTag(){

    if(!tagCodigo){
        return;
    }


    const aviso =
        document.getElementById(
            "avisoAtivacao"
        );


    const codigo =
        document.getElementById(
            "codigoTag"
        );


    aviso.classList.remove(
        "hidden"
    );


    codigo.textContent =
        "TAG: " + tagCodigo;

}


/* =====================================================
   ABRIR CADASTRO
===================================================== */

function mostrarCadastro(){

    document
        .getElementById("loginBox")
        .classList.add("hidden");


    document
        .getElementById("cadastroBox")
        .classList.remove("hidden");


    limparMensagens();

}


/* =====================================================
   VOLTAR PARA LOGIN
===================================================== */

function mostrarLogin(){

    document
        .getElementById("cadastroBox")
        .classList.add("hidden");


    document
        .getElementById("loginBox")
        .classList.remove("hidden");


    limparMensagens();

}


/* =====================================================
   LIMPAR MENSAGENS
===================================================== */

function limparMensagens(){

    const login =
        document.getElementById(
            "mensagemLogin"
        );


    const cadastro =
        document.getElementById(
            "mensagemCadastro"
        );


    login.textContent = "";

    login.className =
        "mensagem";


    cadastro.textContent = "";

    cadastro.className =
        "mensagem";

}


/* =====================================================
   MENSAGEM
===================================================== */

function mensagem(
    id,
    texto,
    tipo
){

    const elemento =
        document.getElementById(id);


    elemento.textContent =
        texto;


    elemento.className =
        "mensagem " + tipo;

}


/* =====================================================
   INICIAR SUPABASE
===================================================== */

function iniciarSupabase(){

    try{

        if(
            window.supabase &&
            typeof window.supabase.createClient ===
            "function"
        ){

            supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );


            console.log(
                "Supabase conectado."
            );

        }else{

            console.log(
                "Supabase ainda não carregou."
            );

        }

    }catch(erro){

        console.error(
            "Erro Supabase:",
            erro
        );

    }

}


/* =====================================================
   IR PARA PRÓXIMA ETAPA
===================================================== */

function continuarComTag(){

    if(tagCodigo){

        window.location.href =
            "painel.html?tag=" +
            encodeURIComponent(
                tagCodigo
            );

    }else{

        window.location.href =
            "painel.html";

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function entrar(){

    limparMensagens();


    if(!supabaseClient){

        mensagem(
            "mensagemLogin",
            "Não foi possível conectar ao sistema. Atualize a página e tente novamente.",
            "erro"
        );

        return;

    }


    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    const senha =
        document
        .getElementById("loginSenha")
        .value;


    if(!email || !senha){

        mensagem(
            "mensagemLogin",
            "Digite seu e-mail e sua senha.",
            "erro"
        );

        return;

    }


    const botao =
        document.getElementById(
            "btnEntrar"
        );


    botao.disabled = true;

    botao.textContent =
        "Entrando...";


    try{

        const resultado =
            await supabaseClient.auth.signInWithPassword({

                email:email,

                password:senha

            });


        if(resultado.error){

            mensagem(
                "mensagemLogin",
                resultado.error.message,
                "erro"
            );

            return;

        }


        mensagem(
            "mensagemLogin",
            "Login realizado com sucesso!",
            "sucesso"
        );


        setTimeout(
            function(){

                continuarComTag();

            },
            700
        );


    }catch(erro){

        console.error(
            erro
        );


        mensagem(
            "mensagemLogin",
            "Erro ao entrar. Tente novamente.",
            "erro"
        );

    }finally{

        botao.disabled = false;

        botao.textContent =
            "Entrar";

    }

}


/* =====================================================
   CADASTRO
===================================================== */

async function cadastrar(){

    limparMensagens();


    if(!supabaseClient){

        mensagem(
            "mensagemCadastro",
            "Não foi possível conectar ao sistema. Atualize a página e tente novamente.",
            "erro"
        );

        return;

    }


    const nome =
        document
        .getElementById("nome")
        .value
        .trim();


    const email =
        document
        .getElementById("cadastroEmail")
        .value
        .trim();


    const telefone =
        document
        .getElementById("telefone")
        .value
        .trim();


    const cidade =
        document
        .getElementById("cidade")
        .value
        .trim();


    const senha =
        document
        .getElementById("cadastroSenha")
        .value;


    if(
        !nome ||
        !email ||
        !telefone ||
        !cidade ||
        !senha
    ){

        mensagem(
            "mensagemCadastro",
            "Preencha todos os campos.",
            "erro"
        );

        return;

    }


    if(senha.length < 6){

        mensagem(
            "mensagemCadastro",
            "A senha precisa ter pelo menos 6 caracteres.",
            "erro"
        );

        return;

    }


    const botao =
        document.getElementById(
            "btnCadastrar"
        );


    botao.disabled = true;

    botao.textContent =
        "Criando conta...";


    try{


        /*
         =================================================
         CRIA A CONTA
         =================================================
        */

        const resultado =
            await supabaseClient.auth.signUp({

                email:email,

                password:senha,

                options:{

                    /*
                     * Depois que o usuário confirmar
                     * o e-mail, ele volta para o login
                     * mantendo a TAG.
                     */

                    emailRedirectTo:
                        tagCodigo
                        ? "https://save-tag-pet.vercel.app/login.html?tag=" +
                          encodeURIComponent(tagCodigo)
                        : "https://save-tag-pet.vercel.app/login.html"

                }

            });


        if(resultado.error){

            mensagem(
                "mensagemCadastro",
                resultado.error.message,
                "erro"
            );

            return;

        }


        const usuario =
            resultado.data.user;


        if(!usuario){

            mensagem(
                "mensagemCadastro",
                "Não foi possível criar a conta.",
                "erro"
            );

            return;

        }


        /*
         =================================================
         SE O SUPABASE JÁ GEROU UMA SESSÃO
         =================================================
        */

        if(resultado.data.session){


            const tutor =
                await supabaseClient
                .from("tutores")
                .upsert({

                    id:usuario.id,

                    nome:nome,

                    telefone:telefone,

                    email:email,

                    cidade:cidade

                });


            if(tutor.error){

                console.error(
                    "Erro ao salvar tutor:",
                    tutor.error
                );


                mensagem(
                    "mensagemCadastro",
                    "A conta foi criada, mas os dados do tutor não foram salvos.",
                    "erro"
                );

                return;

            }


            mensagem(
                "mensagemCadastro",
                "Conta criada com sucesso!",
                "sucesso"
            );


            setTimeout(
                function(){

                    continuarComTag();

                },
                1000
            );


        }else{


            /*
             =================================================
             CONFIRMAÇÃO DE E-MAIL
             =================================================
            */

            mensagem(
                "mensagemCadastro",
                "Conta criada! Verifique seu e-mail para confirmar o cadastro. Depois, entre novamente para continuar a ativação da TAG.",
                "sucesso"
            );

        }


    }catch(erro){

        console.error(
            erro
        );


        mensagem(
            "mensagemCadastro",
            "Erro ao criar a conta. Tente novamente.",
            "erro"
        );

    }finally{

        botao.disabled = false;

        botao.textContent =
            "Criar conta";

    }

}


/* =====================================================
   RECUPERAR SENHA
===================================================== */

async function recuperarSenha(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    if(!email){

        mensagem(
            "mensagemLogin",
            "Digite seu e-mail para receber o link de recuperação.",
            "erro"
        );

        return;

    }


    if(!supabaseClient){

        mensagem(
            "mensagemLogin",
            "Não foi possível conectar ao sistema. Atualize a página e tente novamente.",
            "erro"
        );

        return;

    }


    try{

        const { error } =
            await supabaseClient
            .auth
            .resetPasswordForEmail(
                email,
                {

                    redirectTo:
                        "https://save-tag-pet.vercel.app/alterar-senha.html"

                }
            );


        if(error){

            mensagem(
                "mensagemLogin",
                error.message,
                "erro"
            );

            return;

        }


        mensagem(
            "mensagemLogin",
            "Enviamos um link para seu e-mail. Verifique sua caixa de entrada.",
            "sucesso"
        );


    }catch(erro){

        console.error(
            erro
        );


        mensagem(
            "mensagemLogin",
            "Não foi possível enviar o e-mail de recuperação.",
            "erro"
        );

    }

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

iniciarSupabase();

mostrarAvisoTag();


</script>

</body>

</html>
