<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Tag Pet | Entrar</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f7f6;
  color:#172b2b;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:22px;
  padding:32px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:800;
  margin-bottom:5px;
}

.logo span{
  color:#35a96b;
}

.subtitle{
  text-align:center;
  color:#687878;
  margin-bottom:28px;
}

h1{
  font-size:22px;
  margin-bottom:20px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin:14px 0 6px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #d7dfdc;
  border-radius:10px;
  font-size:15px;
}

button{
  width:100%;
  border:0;
  padding:14px;
  margin-top:20px;
  border-radius:10px;
  background:#35a96b;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#172b2b;
}

.message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
}

.link{
  text-align:center;
  margin-top:20px;
  color:#35a96b;
  cursor:pointer;
  font-weight:bold;
}

.hidden{
  display:none;
}

.voltar{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#687878;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    Save Tag <span>Pet</span>
  </div>

  <div class="subtitle">
    Identidade digital do seu pet
  </div>

  <!-- LOGIN -->
  <div id="loginBox">

    <h1>Entrar na minha conta</h1>

    <label>E-mail</label>
    <input id="loginEmail" type="email" placeholder="seu@email.com">

    <label>Senha</label>
    <input id="loginPassword" type="password" placeholder="Sua senha">

    <button onclick="entrar()">
      Entrar
    </button>

    <div class="message" id="loginMessage"></div>

    <div class="link" onclick="mostrarCadastro()">
      Ainda não tenho uma conta
    </div>

  </div>


  <!-- CADASTRO -->
  <div id="cadastroBox" class="hidden">

    <h1>Criar minha conta</h1>

    <label>Nome</label>
    <input id="nome" type="text" placeholder="Seu nome">

    <label>E-mail</label>
    <input id="cadEmail" type="email" placeholder="seu@email.com">

    <label>Senha</label>
    <input id="cadPassword" type="password" placeholder="Crie uma senha">

    <label>Telefone / WhatsApp</label>
    <input id="telefone" type="tel" placeholder="(13) 99999-9999">

    <button onclick="cadastrar()">
      Criar minha conta
    </button>

    <div class="message" id="cadMessage"></div>

    <div class="link" onclick="mostrarLogin()">
      Já tenho uma conta
    </div>

  </div>

  <a class="voltar" href="index.html">
    ← Voltar para o site
  </a>

</div>


<script>

const SUPABASE_URL = "https://mqiwoubhivutavpnpeax.supabase.co";
const SUPABASE_KEY = "sb_publishable_JV-XGEU9DeEG2ZfjGbUw1g_ul0dflll";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function mostrarCadastro(){

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("cadastroBox").classList.remove("hidden");

}


function mostrarLogin(){

  document.getElementById("cadastroBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");

}


async function cadastrar(){

  const nome = document.getElementById("nome").value.trim();
  const email = document.getElementById("cadEmail").value.trim();
  const password = document.getElementById("cadPassword").value;
  const telefone = document.getElementById("telefone").value.trim();

  const mensagem = document.getElementById("cadMessage");

  if(!nome || !email || !password){

    mensagem.textContent =
      "Preencha nome, e-mail e senha.";

    return;
  }

  mensagem.textContent = "Criando sua conta...";

  const { data, error } = await supabase.auth.signUp({

    email: email,
    password: password,

    options:{
      data:{
        nome: nome,
        telefone: telefone
      }
    }

  });

  if(error){

    mensagem.textContent =
      "Erro: " + error.message;

    return;
  }

  mensagem.textContent =
    "Conta criada! Verifique seu e-mail para confirmar o cadastro.";

}


async function entrar(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const mensagem =
    document.getElementById("loginMessage");

  if(!email || !password){

    mensagem.textContent =
      "Digite seu e-mail e sua senha.";

    return;
  }

  mensagem.textContent = "Entrando...";

  const { data, error } =
    await supabase.auth.signInWithPassword({

      email: email,
      password: password

    });

  if(error){

    mensagem.textContent =
      "E-mail ou senha incorretos.";

    return;
  }

  mensagem.textContent =
    "Login realizado!";

  setTimeout(function(){

    window.location.href = "painel.html";

  },800);

}

</script>

</body>
</html>
