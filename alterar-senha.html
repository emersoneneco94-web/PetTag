<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alterar senha — Save Tag Pet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#effaf8;color:#17393e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:100%;max-width:430px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.08)}.logo{text-align:center;font-size:28px;font-weight:900;color:#0d3035}.logo span{color:#1eb0a7}.sub{text-align:center;color:#718284;margin:7px 0 25px}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d8e5e1;border-radius:12px;font-size:16px}.btn{width:100%;border:0;border-radius:13px;padding:14px;background:#064a4b;color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;text-align:center;line-height:1.4}.msg.ok{display:block;background:#e8f7ef;color:#187443}.msg.err{display:block;background:#fdecec;color:#a52b2b}.back{display:block;text-align:center;margin-top:20px;color:#52706e;text-decoration:none}</style>
</head><body>
<div class="box"><div class="logo">Save <span>Tag</span> Pet 🐾</div><div class="sub">Crie uma nova senha para sua conta.</div><div class="field"><label>Nova senha</label><input id="senha" type="password" minlength="6" autocomplete="new-password"></div><div class="field"><label>Confirmar nova senha</label><input id="confirmar" type="password" minlength="6" autocomplete="new-password"></div><button id="btn" class="btn" onclick="alterarSenha()">Salvar nova senha</button><div id="msg" class="msg"></div><a class="back" href="login.html">← Voltar para o login</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://mqiwoubhivutavpnpeax.supabase.co";
const SUPABASE_KEY="sb_publishable_JV-XGEU9DeEG2ZfjGbUw1g_ul0dflll";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function msg(t,c){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+c;}
async function alterarSenha(){const a=document.getElementById('senha').value,b=document.getElementById('confirmar').value;if(a.length<6){msg('A senha precisa ter pelo menos 6 caracteres.','err');return}if(a!==b){msg('As senhas não conferem.','err');return}const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='Salvando...';const {data}=await client.auth.getSession();if(!data.session){msg('O link de recuperação expirou. Solicite uma nova recuperação de senha.','err');btn.disabled=false;btn.textContent='Salvar nova senha';return}const {error}=await client.auth.updateUser({password:a});if(error){msg(error.message||'Não foi possível alterar a senha.','err');btn.disabled=false;btn.textContent='Salvar nova senha';return}msg('Senha alterada com sucesso! Você será levado ao login.','ok');setTimeout(async()=>{await client.auth.signOut();window.location.href='login.html';},1200)}
</script></body></html>
